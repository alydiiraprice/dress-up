<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>Dress Up Game</title>
</head>
<body>
    <div id="background">
        <div id="scene-bg"></div>
        <div id="skin"></div>
        <div id="makeup"></div>
        <div id="eyes"></div>
        <div id="hair"></div>
        <div id="accessories"></div>
        <div id="pants"></div>
        <div id="shirts"></div>
    </div>

    <div id="controls">
        <input type="button" value="Skin" id="nextSkin" onclick="nextSkin()">
        <input type="button" value="Makeup" id="nextMakeup" onclick="nextMakeup()">
        <input type="button" value="Eyes" id="nextEyes" onclick="nextEyes()">
        <input type="button" value="Hair" id="nextHair" onclick="nextHair()">
        <input type="button" value="Tops" id="nextShirt" onclick="nextShirt()">
        <input type="button" value="Bottoms" id="nextPant" onclick="nextPant()">
        <input type="button" value="Accessories" id="nextAccessories" onclick="nextAccessories()">
        <input type="button" value="Scene" id="nextScene" onclick="nextScene()">
    </div>
    
</body>
<script src="code.js">
</script>
</html>
